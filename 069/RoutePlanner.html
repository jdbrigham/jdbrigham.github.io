/* ---- State: filters and edits persist on this phone; position and window start fresh each open ---- */
const KEY='93-north-eats-v1';
let S={cat:'all',hidden:[],mine:[],maps:'apple',stop:'dt',collapsed:[],dir:'north'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){delete s.on;S=Object.assign(S,s)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let editing=false, view='list', showOut=false, pos='START', sel=null;
/* ---- GPS: snap the phone's position onto the route to find how far along you are ---- */
let gps={on:false,ok:false,min:null,off:null,dir:null,hist:[],ll:null,msg:''},gpsWatch=null,gpsTimer=null;
const ROUTE=[START].concat(EXITS,WAYPTS,[RUTLAND]).sort((a,b)=>a.min-b.min);
const N=()=>S.dir!=='south';
const prog=m=>N()?m:TOTAL-m;                       // minutes from today's starting point
const ORDER=()=>N()?EXITS:EXITS.slice().reverse();
const ENDPOINT=new Set(['RUT','RUT7']);
const exitName=x=>x.rest?'Rest area':x.us4?x.label:(x.hwy==='89'?'I-89 ':x.vt?'VT ':'')+'Exit '+(x.label||x.id);
const sideOf=s=>{if(N())return s.side;const x=EXITS.find(e=>e.id===s.exit);if(x&&ENDPOINT.has(x.id))return s.side;return {L:'R',R:'L'}[s.side]||s.side};
function noteOf(s){
  if(N()||!s.note)return s.note;
  if(/ramp/i.test(s.note))return s.addr;
  if(ENDPOINT.has(s.exit))return s.note;
  return s.note.replace(/\b(left|right)\b/g,m=>m==='left'?'right':'left').replace(/US 4 west/g,'US 4 east');
}
function locate(lat,lon){
  let best={d:1e9};
  for(let i=0;i<ROUTE.length-1;i++){
    const a=ROUTE[i],b=ROUTE[i+1],c=Math.cos(lat*Math.PI/180);
    const ax=a.ll[1]*c*69,ay=a.ll[0]*69,bx=b.ll[1]*c*69,by=b.ll[0]*69,px=lon*c*69,py=lat*69;
    const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    if(d<best.d)best={d,min:a.min+t*(b.min-a.min)};
  }
  return best;
}
function onFix(p){
  clearTimeout(gpsTimer);
  const {latitude:lat,longitude:lon,accuracy}=p.coords, r=locate(lat,lon);
  gps.ll=[lat,lon];gps.off=r.d;
  if(r.d>3){gps.msg=`You’re ${r.d.toFixed(0)} mi from the route, so exits aren’t being hidden.`;if(gps.min==null)gps.ok=false;render();return}
  const moved=gps.min==null||Math.abs(r.min-gps.min)>=0.5;
  gps.ok=true;gps.min=r.min;gps.hist.push(r.min);if(gps.hist.length>6)gps.hist.shift();
  const d=gps.hist[gps.hist.length-1]-gps.hist[Math.max(0,gps.hist.length-3)];
  if(d>0.6)gps.dir='north';else if(d<-0.6)gps.dir='south';
  if(gps.dir&&gps.dir!==S.dir){S.dir=gps.dir;save();vb=null;fillPos();toast(N()?'Heading north. Switched to To Rutland':'Heading south. Switched to To Boston')}
  const near=ORDER().filter(x=>prog(x.min)<=prog(gps.min)+0.3).pop();
  gps.msg=`GPS: ${near?'past '+exitName(near):'just starting out'}${accuracy>500?' · weak signal':''}. Passed exits are hidden.`;
  if(moved||!$('gpsline').textContent)render();
}
function onFixErr(e){
  if(gps.ok&&!(e&&e.code===1)){gps.msg='GPS signal lost. Using your last known position.';render();return}
  clearTimeout(gpsTimer);
  gps.on=false;gps.ok=false;
  gps.msg=e&&e.code===1?'Location isn’t allowed here. Pick your exit from the list instead.':'Couldn’t get a location fix. Pick your exit from the list instead.';
  stopGps(true);render();
}
function startGps(){
  if(!('geolocation' in navigator)){onFixErr();return}
  gps={on:true,ok:false,min:null,off:null,dir:null,hist:[],ll:null,msg:'Finding your location…'};render();
  try{gpsWatch=navigator.geolocation.watchPosition(onFix,onFixErr,{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}catch(e){onFixErr()}
  gpsTimer=setTimeout(()=>{if(!gps.ok)onFixErr({code:1})},25000);
}
function stopGps(keepMsg){
  try{if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch)}catch(e){}
  gpsWatch=null;clearTimeout(gpsTimer);
  if(pos==='GPS'){pos='START';if($('pos'))$('pos').value='START'}
  if(!keepMsg)gps.msg='';
}
const startLL=()=>N()?START.ll:RUTLAND.ll;
const meLL=()=>pos==='GPS'&&gps.ll?gps.ll:pos==='GPS'||pos==='START'?startLL():EXITS.find(e=>e.id===pos).ll;
const now0=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let W={a:now0(),b:now0()+60};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catOn=c=>S.cat==='all'?c!=='coffee':S.cat===c;
function spots(){
  const seed=SEED.map(a=>({id:a[0],exit:a[1],name:a[2],cat:a[3],mi:a[4],side:a[5],addr:a[6],note:a[7]||''}));
  return seed.concat(S.mine.map(m=>Object.assign({mine:true},m)));
}
function mapUrl(addr,name){
  return S.maps==='google'?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(name+', '+addr)}`
                         :`https://maps.apple.com/?daddr=${encodeURIComponent(addr)}&dirflg=d`;
}
const SIDE={L:'← left',R:'right →',O:'on route',A:'along route'};
const isSunday=()=>new Date().getDay()===0;
function driveMin(s){return (s.side==='O'||s.side==='A')?1:2+s.mi*2*60/22}
function addedMin(s){return Math.round(driveMin(s)+STOPS[S.stop].min)}

/* ---- Timing ---- */
const posMin=()=>pos==='GPS'?(gps.ok?prog(gps.min):0):pos==='START'?0:prog(EXITS.find(x=>x.id===pos).min);
const clock=m=>{m=((Math.round(m)%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60;const ap=h<12?'a':'p';return (h%12||12)+':'+String(mm).padStart(2,'0')+ap};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function etaOf(x){return now0()+(prog(x.min)-posMin())}            // minutes since midnight (may exceed 1440)
function state(x){
  if(prog(x.min)<posMin()-(pos==='GPS'?0.3:0))return'behind';
  const e=etaOf(x);let a=W.a,b=W.b;if(b<a)b+=1440;
  const inW=(t)=>t>=a&&t<=b;
  return (inW(e)||inW(e+1440)||inW(e-1440))?'in':'out';
}

/* ---- Header controls ---- */
function renderChips(){
  $('chips').innerHTML=Object.keys(CATS).map(k=>`<button class="chip" style="--c:${k==='all'?'var(--fg)':'var(--c-'+k+')'}" data-k="${k}" aria-pressed="${S.cat===k}">${k==='all'?'':'<i></i>'}${CATS[k]}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.cat=(S.cat===k&&k!=='all')?'all':k;save();render()});
}
function renderSeg(){
  $('seg').innerHTML=Object.keys(STOPS).map(k=>`<button data-s="${k}" aria-pressed="${S.stop===k}">${STOPS[k].label}${STOPS[k].min?' '+STOPS[k].min+'m':''}</button>`).join('');
  $('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.stop=b.dataset.s;save();render()});
}
function fillPos(){
  $('pos').innerHTML=`<option value="GPS">Use my location</option><option value="START">Leaving ${N()?'Boston':'Rutland'} now</option>`+ORDER().filter(x=>!x.rest&&x.id!=='RUT7').map(x=>`<option value="${x.id}">Near ${exitName(x)}${x.us4?'':' · '+esc(x.town.split(' · ')[0])}</option>`).join('');
  $('pos').value=pos;
}
function renderDir(){
  $('dirSeg').innerHTML=`<button data-d="north" aria-pressed="${N()}">To Rutland ↑</button><button data-d="south" aria-pressed="${!N()}">To Boston ↓</button>`;
  $('dirSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(S.dir===b.dataset.d)return;S.dir=b.dataset.d;save();
    if(pos!=='GPS')pos='START';sel=null;showOut=false;vb=null;fillPos();render()});
}
function initWindow(){
  fillPos();
  $('w0').value=hhmm(W.a);$('w1').value=hhmm(W.b);
  $('pos').onchange=()=>{const v=$('pos').value;sel=null;if(v==='GPS'){pos='GPS';startGps()}else{stopGps();pos=v;render()}};
  try{navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted'&&pos==='START'){pos='GPS';$('pos').value='GPS';startGps()}}).catch(()=>{})}catch(e){}
  const parse=v=>{const[h,m]=v.split(':').map(Number);return h*60+m};
  $('w0').onchange=()=>{if($('w0').value){const d=W.b-W.a;W.a=parse($('w0').value);if(d>0&&parse($('w1').value)<=W.a){W.b=W.a+d;$('w1').value=hhmm(W.b)}render()}};
  $('w1').onchange=()=>{if($('w1').value){W.b=parse($('w1').value);render()}};
  $('wReset').onclick=()=>{W={a:now0(),b:now0()+60};$('w0').value=hhmm(W.a);$('w1').value=hhmm(W.b);render()};
}

/* ---- Shared row markup ---- */
function exitHead(x,list,col,st,btn){
  const num=x.label||x.id, quick=list.length?Math.min(...list.map(addedMin)):0;
  const eta=st==='behind'?'passed':'~'+clock(etaOf(x));
  const tag=btn?'button':'div';
  return `<${tag} class="exit-h" ${btn?`data-x="${x.id}" aria-expanded="${!col}" aria-controls="sp-${x.id}"`:''}>
      <div class="tab ${x.rest?'rest':x.us4?'us':''}">${x.rest?'<b style="font-size:1rem;padding-block:4px">REST</b>':x.us4?`<small>US 4</small><b class="tn">${esc(x.label)}</b>`:`<small>${x.hwy==='89'?'89 · EXIT':x.vt?'VT · EXIT':'EXIT'}</small><b>${num}</b>`}</div>
      <div class="where"><div class="road">${esc(x.road)}</div><div class="sub"><span class="eta">${eta}</span> · ${esc(x.town)}${x.old?` <span class="old">· old ${x.old}</span>`:''}</div></div>
      ${btn?`<span class="cnt">${list.length} spot${list.length===1?'':'s'}<span>from +${quick} min</span></span><span class="chev" aria-hidden="true"></span>`:''}</${tag}>`;
}
function spotRow(s){
  const sun=/Closed Sun/.test(s.note)&&isSunday();
  const hid=S.hidden.includes(s.id);

    <span class="info"><span class="nm">${esc(s.name)}</span>${sun?'<span class="tag">Closed today</span>':''}${s.mine?'<span class="tag mine">Added</span>':''}
    <span class="ad" style="display:block">${esc(noteOf(s)||s.addr)}</span></span>
    <span class="dist"><span class="add">+${addedMin(s)} min</span><span class="mi">${s.side==='O'||(s.side==='A'&&!s.mi)?'':s.mi.toFixed(s.mi<1?2:1).replace(/0$/,'')+' mi · '}${SIDE[sideOf(s)]||''}</span></span>`;
  if(editing)return `<div class="spot ${hid?'closed':''}">${inner}<button class="hide" data-h="${s.id}" aria-label="${hid?'Show':'Hide'} ${esc(s.name)}">${hid?'↺':'✕'}</button></div>`;
  return `<a class="spot ${sun?'closed':''}" href="${mapUrl(s.addr,s.name)}" target="_blank" rel="noopener">${inner}</a>`;
}
function visibleSpots(){return spots().filter(s=>catOn(s.cat)&&(editing||!S.hidden.includes(s.id)))}

      h+=`<div class="hwy">${hw==='VT'?'<span class="vt">VT</span>':hw==='US4'?'<span class="usshield">4</span>':`<span class="ishield">${hw}</span>`}<div><div class="road">${H[0]}</div><div class="sub">${H[1]}</div></div></div>`}
    const col=S.collapsed.includes(x.id);ids.push(x.id);if(!col)anyCol=true;
    h+=`<section class="exit ${col?'col':''} ${st==='out'?'out':''}" id="x-${x.id}">${exitHead(x,list,col,st,true)}<div class="spots" id="sp-${x.id}">${list.map(spotRow).join('')}</div></section>`;
  });
  if(!h)h=`<div class="empty">No exits with ${S.cat==='all'?'food':CATS[S.cat].toLowerCase()} in your window. Widen the window${S.cat!=='all'?' or tap '+CATS[S.cat]+' again to see everything':''}.</div>`;
  if(outN&&!editing)h+=`<button class="outbtn" id="outBtn">${showOut?'Hide':'Show'} ${outN} exit${outN===1?'':'s'} outside your window</button>`;
  if(ids.length)h+=`<button class="outbtn" id="allBtn" style="border-style:solid">${anyCol?'Collapse all':'Expand all'}</button>`;
  h+=N()?`<div class="end"><span class="usshield">4</span><div><div class="road" style="font-family:var(--sign-font);font-weight:700">Rutland</div><div class="sub">End of the route.</div></div></div>`
        :`<div class="end"><span class="ishield">93</span><div><div class="road" style="font-family:var(--sign-font);font-weight:700">Boston</div><div class="sub">End of the route.${pos!=='GPS'?'':''}</div></div></div>`;
  if(!N())h+=`<div class="note" style="padding-bottom:12px">Heading south, left and right are flipped from the northbound listings. A few southbound ramps differ, so check the turn as you exit.</div>`;
  if(editing)h+=editPanel();
  $('main').innerHTML=h;
  wireRows($('main'));
  if($('outBtn'))$('outBtn').onclick=()=>{showOut=!showOut;render()};
  if($('allBtn'))$('allBtn').onclick=()=>{S.collapsed=anyCol?EXITS.map(x=>x.id):[];save();render()};
  if(editing)wireEdit();
}
function wireRows(root){
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const id=b.dataset.x;
    S.collapsed=S.collapsed.includes(id)?S.collapsed.filter(x=>x!==id):S.collapsed.concat(id);save();
    const c=S.collapsed.includes(id);b.closest('.exit').classList.toggle('col',c);b.setAttribute('aria-expanded',!c)});
  root.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const id=b.dataset.h;
    S.hidden=S.hidden.includes(id)?S.hidden.filter(x=>x!==id):S.hidden.concat(id);
    const m=S.mine.find(m=>m.id===id); if(m&&S.hidden.includes(id)){S.mine=S.mine.filter(x=>x.id!==id);S.hidden=S.hidden.filter(x=>x!==id);toast('Removed')}
    save();render()});
}

/* ---- Map view: drawn from interchange coordinates (no map tiles) ---- */
const K=Math.cos(43.1*Math.PI/180);
const P=ll=>[(ll[1]+73.05)*K*1000,(43.75-ll[0])*1000];
const FULL={x:-40,y:-40,w:(73.05-71.0)*K*1000+80,h:(43.75-42.33)*1000+80};
let vb=null;
function fitTo(pts,pad=60){
  if(!pts.length){vb={...FULL};return}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const el=$('map'),ar=el?el.clientWidth/el.clientHeight:0.8;
  let w=x1-x0,h=y1-y0;if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-h)/2;h=nh}
  vb={x:x0,y:y0,w,h};
}
function windowPts(){return EXITS.filter(x=>state(x)==='in').map(x=>P(x.ll)).concat([P(meLL())])}
function renderMap(vis){
  if(!$('map')){
    $('main').innerHTML=`<div class="mapwrap"><svg id="map" role="img" aria-label="Route map with exits"></svg>
      <div class="mapctl"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button class="wide" id="zWin" aria-label="Zoom to your window">WIN</button><button class="wide" id="zAll" aria-label="Show whole route">ALL</button></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>In window</span><span><i style="background:#5f6a64"></i>Later / earlier</span><span><i style="background:#fff"></i>You</span></div></div>
      <div class="sheet" id="sheet"></div>`;
    wireMap();
    vb=null;
  }
  if(!vb)fitTo(windowPts().length>1?windowPts():[]);
  drawMap(vis);drawSheet(vis);
}
function drawMap(vis){
  const svg=$('map');if(!svg)return;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const u=vb.w/svg.clientWidth; // user units per screen px
  const line=pts=>pts.map(p=>P(p).join(',')).join(' ');
  const i93=[START.ll].concat(EXITS.filter(x=>!x.hwy).map(x=>x.ll)), split=[43.155,-71.515];
  const i89=[EXITS.find(x=>x.id==='REST').ll,split].concat(EXITS.filter(x=>x.hwy==='89'||x.hwy==='VT').map(x=>x.ll));
  const us4=ROUTE.filter(r=>r.min>=126).map(r=>r.ll);
  const i93n=[split,[43.30,-71.60],[43.45,-71.66]];
  const maNh=[[42.70,-71.62],[42.74,-71.30],[42.75,-71.20],[42.80,-71.05],[42.87,-70.82]];
  const nhVt=[[43.35,-72.40],[43.55,-72.37],[43.64,-72.32],[43.76,-72.22]];
  let g=`<rect x="${FULL.x-2000}" y="${FULL.y-2000}" width="${FULL.w+4000}" height="${FULL.h+4000}" fill="#0c100e"/>`;
  g+=`<polyline points="${line(maNh)}" fill="none" stroke="#3a463f" stroke-width="${1.5*u}" stroke-dasharray="${6*u} ${5*u}"/>`;
  g+=`<polyline points="${line(nhVt)}" fill="none" stroke="#3a463f" stroke-width="${1.5*u}" stroke-dasharray="${6*u} ${5*u}"/>`;
  const st=(ll,t,dx=0,dy=0)=>{const p=P(ll);return `<text x="${p[0]+dx*u}" y="${p[1]+dy*u}" font-size="${13*u}" fill="#4d5a53" font-weight="800" letter-spacing="${2*u}">${t}</text>`};
  g+=st([42.62,-71.45],'MA')+st([42.86,-71.55],'NH')+st([43.74,-72.62],'VT');
  g+=`<polyline points="${line(i93n)}" fill="none" stroke="#2a3a55" stroke-width="${4*u}" stroke-linecap="round"/>`;
  g+=`<polyline points="${line(i93)}" fill="none" stroke="#3d7be0" stroke-width="${4.5*u}" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=`<polyline points="${line(i89)}" fill="none" stroke="#3d7be0" stroke-width="${4.5*u}" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=`<polyline points="${line(us4)}" fill="none" stroke="#d8d4ca" stroke-width="${3.5*u}" stroke-linecap="round"/>`;
  const towns=[[START.ll,'Boston',8,4],[[42.4795,-71.1235],'Woburn',-52,4],[[42.7140,-71.1960],'Methuen',10,4],[[42.9930,-71.4340],'Manchester',12,4],[[43.2070,-71.5370],'Concord',10,-6],[[43.4100,-71.9850],'New London',10,-8],[[43.6420,-72.2520],'Lebanon',-20,-14],[[43.6240,-72.5185],'Woodstock',-30,20],[[43.6650,-72.8000],'Killington',-30,-12],[RUTLAND.ll,'Rutland',-20,22]];
  towns.forEach(([ll,t,dx,dy])=>{const p=P(ll);g+=`<text x="${p[0]+dx*u}" y="${p[1]+dy*u}" font-size="${11.5*u}" fill="#98a39c" font-weight="600">${t}</text>`});
  const sh=(ll,t,dx,dy)=>{const p=P(ll),x=p[0]+dx*u,y=p[1]+dy*u;return `<g><path d="M${x-9*u} ${y-10*u}h${18*u}v${10*u}c0 ${7*u}-${5*u} ${10*u}-${9*u} ${12*u}c-${4*u}-${2*u}-${9*u}-${5*u}-${9*u}-${12*u}z" fill="#1f4fa8" stroke="#fff" stroke-width="${1*u}"/><text x="${x}" y="${y+2*u}" font-size="${9*u}" fill="#fff" font-weight="800" text-anchor="middle">${t}</text></g>`};
  g+=sh([42.58,-71.12],'93',22,0)+sh([43.33,-71.84],'89',-4,-18);
  // markers, drawn behind-first so in-window sit on top
  const order=EXITS.map(x=>({x,st:state(x),n:vis.filter(s=>s.exit===x.id&&!S.hidden.includes(s.id)).length})).sort((a,b)=>({behind:0,out:1,in:2}[a.st])-({behind:0,out:1,in:2}[b.st]));
  order.forEach(({x,st,n})=>{
    const p=P(x.ll), r=(n?11:4)*u, isSel=sel===x.id;
    const fill=st==='in'?(n?'var(--accent)':'#8a6a3a'):st==='out'?'#3a4440':'#1d2420';
    const stroke=isSel?'#fff':st==='in'?'#1d1405':'#59655e';
    g+=`<g data-mx="${x.id}" style="cursor:pointer"><circle cx="${p[0]}" cy="${p[1]}" r="${Math.max(r,14*u)}" fill="transparent"/>
      <circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${(isSel?2.5:1.2)*u}" opacity="${st==='behind'?.5:1}"/>`;
    if(n)g+=`<text x="${p[0]}" y="${p[1]+4*u}" font-size="${11*u}" text-anchor="middle" font-weight="800" fill="${st==='in'?'#1d1405':'#c9d0cb'}">${n}</text>`;
    if(n&&(st==='in'||isSel)&&u<0.9)g+=`<text x="${p[0]+15*u}" y="${p[1]+4*u}" font-size="${10.5*u}" fill="#eef0ec" font-weight="700">${exitName(x)} · ${clock(etaOf(x))}</text>`;
    g+='</g>';
  });
  const me=P(meLL());
  g+=`<circle cx="${me[0]}" cy="${me[1]}" r="${16*u}" fill="#ffffff" opacity=".12"/><circle cx="${me[0]}" cy="${me[1]}" r="${6*u}" fill="#fff" stroke="#101412" stroke-width="${2*u}"/>`;
  svg.innerHTML=g;
}
function drawSheet(vis){
  const el=$('sheet');if(!el)return;
  if(!sel){el.innerHTML=`<div class="hint">Tap a numbered exit to see its spots. Amber exits are the ones you’ll reach between ${clock(W.a)} and ${clock(W.b)}.</div>`;return}
  const x=EXITS.find(e=>e.id===sel), list=vis.filter(s=>s.exit===sel).sort((a,b)=>a.mi-b.mi), st=state(x);
  el.innerHTML=`<section class="exit ${st==='out'?'':''}">${exitHead(x,list,false,st,false)}<div class="spots">${list.length?list.map(spotRow).join(''):`<div class="hint">No ${S.cat==='all'?'food':CATS[S.cat].toLowerCase()} at this exit.</div>`}</div></section>`;
  wireRows(el);
}
function wireMap(){
  const svg=$('map'), pts=new Map(); let moved=0, last=null, pinch=null;
  const toUser=(cx,cy)=>{const r=svg.getBoundingClientRect();return[vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h]};
  const zoomAt=(f,cx,cy)=>{const [ux,uy]=toUser(cx,cy);const nw=Math.min(Math.max(vb.w*f,40),FULL.w*2.2);f=nw/vb.w;vb={x:ux-(ux-vb.x)*f,y:uy-(uy-vb.y)*f,w:vb.w*f,h:vb.h*f};drawMap(visibleSpots())};
  svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;last=[e.clientX,e.clientY];
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])}}});
  svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>0){zoomAt(pinch.d/d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch.d=d}moved+=10;return}
    const dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);
    const r=svg.getBoundingClientRect();vb.x-=dx/r.width*vb.w;vb.y-=dy/r.height*vb.h;svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)});
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;
    if(pts.size===0&&moved<8){const t=document.elementFromPoint(e.clientX,e.clientY);const m=t&&t.closest('[data-mx]');if(m){sel=m.dataset.mx;const v=visibleSpots();drawMap(v);drawSheet(v);$('sheet').scrollIntoView({behavior:'smooth',block:'nearest'})}}
    else if(pts.size===0)drawMap(visibleSpots())};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=null});
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
  const ctr=f=>{const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)};
  $('zIn').onclick=()=>ctr(0.6);$('zOut').onclick=()=>ctr(1.6);
  $('zWin').onclick=()=>{fitTo(windowPts());drawMap(visibleSpots())};
  $('zAll').onclick=()=>{fitTo([P(START.ll),P(RUTLAND.ll),P([43.70,-72.0])],95);drawMap(visibleSpots())};
}

/* ---- Edit panel ---- */
function editPanel(){
  const opts=EXITS.map(x=>`<option value="${x.id}">${x.us4||x.rest?exitName(x):(x.hwy?'':'I-93 ')+exitName(x)} · ${esc(x.town.split(' · ')[0])}</option>`).join('');
  const cats=Object.keys(CATS).filter(k=>k!=='all').map(k=>`<option value="${k}">${CATS[k]}</option>`).join('');
  return `<div class="panel" id="addPanel"><h2>Add a spot</h2>
    <label>Name<input id="fName" autocomplete="off" placeholder="Chick-fil-A"></label>
    <div class="frow"><label>Exit<select id="fExit">${opts}</select></label><label>Type<select id="fCat">${cats}</select></label></div>
    <div class="frow"><label>Miles from exit<input id="fMi" type="number" inputmode="decimal" step="0.05" min="0" value="0.3"></label>
      <label>Side (heading north)<select id="fSide"><option value="R">Right</option><option value="L">Left</option><option value="A">Along the route</option><option value="O">At a rest area</option></select></label></div>
    <label>Address (for directions)<input id="fAddr" autocomplete="off" placeholder="123 Main St, Town, NH"></label>
    <label>Note (optional)<input id="fNote" autocomplete="off" placeholder="Drive-thru, closed Sundays…"></label>
    <button class="btn pri" id="fSave">Add spot</button></div>
  <div class="panel"><h2>Settings</h2>
    <label>Open directions in<select id="fMaps"><option value="apple">Apple Maps</option><option value="google">Google Maps</option></select></label>
    <button class="btn" id="fText">Copy as plain text</button>
    <div class="frow"><button class="btn" id="fExport">Copy my list</button><button class="btn" id="fImport">Paste a list</button></div>
    <textarea id="fJson" rows="4" hidden placeholder="Paste a copied list here, then tap Paste a list again"></textarea>
    <div class="note">Tap ✕ to hide a spot, ↺ to bring it back. While editing, every exit shows regardless of your window. Your additions and hidden spots are saved on this phone only. Distances and sides are for the northbound ramp. Time added is an estimate: 2 min for the ramps, the round trip on local roads at about 22 mph, plus the stop type chosen at the top. Arrival times assume free-flowing traffic. Use my location needs the page opened from a regular website (such as your own GitHub Pages copy); inside Claude it isn’t allowed, so pick your exit by hand.</div></div>`;
}
function wireEdit(){
  $('fMaps').value=S.maps;$('fMaps').onchange=()=>{S.maps=$('fMaps').value;save()};
  $('fSave').onclick=()=>{
    const name=$('fName').value.trim();if(!name){toast('Add a name first');$('fName').focus();return}
    const town=(EXITS.find(x=>x.id===$('fExit').value)||{}).town||'';
    S.mine.push({id:'m'+Date.now(),exit:$('fExit').value,name,cat:$('fCat').value,mi:Math.max(0,parseFloat($('fMi').value)||0),side:$('fSide').value,
      addr:$('fAddr').value.trim()||name+', '+town.split(' · ')[0],note:$('fNote').value.trim()});
    save();render();toast('Added '+name)};
  $('fText').onclick=()=>{const all=spots().filter(s=>catOn(s.cat)&&!S.hidden.includes(s.id));let t='',lh=null;const HW=N()?HWYN:HWYS;
    ORDER().forEach(x=>{const l=all.filter(s=>s.exit===x.id).sort((a,b)=>a.mi-b.mi);if(!l.length)return;const hw=x.hwy||'93';if(hw!==lh){lh=hw;t+='\n== '+HW[hw][0]+' ==\n'}
      t+=`\n${exitName(x)} – ${x.road}, ${x.town}\n`;l.forEach(s=>t+=`  ${s.name} (+${addedMin(s)} min) – ${s.side==='O'?'at rest area':s.side==='A'&&!s.mi?'on the route':s.mi+' mi '+(SIDE[sideOf(s)]||'').replace(/[←→]/g,'').trim()} – ${s.addr}\n`)});
    t=((N()?'Boston to Rutland':'Rutland to Boston')+' fast food\n'+t).trim();
    const fb=()=>{const ta=$('fJson');ta.hidden=false;ta.value=t;ta.select();toast('Selected. Copy it now')};
    try{navigator.clipboard.writeText(t).then(()=>toast('Text list copied'),fb)}catch(e){fb()}};
  $('fExport').onclick=()=>{const t=JSON.stringify({mine:S.mine,hidden:S.hidden});
    const fb=()=>{const ta=$('fJson');ta.hidden=false;ta.value=t;ta.select();toast('Selected. Copy it now')};
    try{navigator.clipboard.writeText(t).then(()=>toast('List copied'),fb)}catch(e){fb()}};
  $('fImport').onclick=()=>{const ta=$('fJson');if(ta.hidden||!ta.value.trim()||ta.value.trim()===JSON.stringify({mine:S.mine,hidden:S.hidden})){ta.hidden=false;ta.value='';ta.focus();return}
    try{const d=JSON.parse(ta.value);if(Array.isArray(d.mine))S.mine=d.mine;if(Array.isArray(d.hidden))S.hidden=d.hidden;save();render();toast('List loaded')}catch(e){toast('That text isn’t a copied list')}};
}

$('vList').onclick=()=>{if(view==='list')return;view='list';render()};
$('vMap').onclick=()=>{if(editing){editing=false;$('editBtn').setAttribute('aria-pressed',false);$('editBtn').textContent='Edit'}view='map';$('main').innerHTML='';render()};
$('editBtn').onclick=()=>{editing=!editing;$('editBtn').setAttribute('aria-pressed',editing);$('editBtn').textContent=editing?'Done':'Edit';if(editing&&view==='map'){view='list'}render();if(editing)setTimeout(()=>$('addPanel')?.scrollIntoView({behavior:'smooth'}),50)};
window.addEventListener('resize',()=>{if(view==='map'&&vb)drawMap(visibleSpots())});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
initWindow();render();
</script>
