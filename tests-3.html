<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Night Photography Test Workflow</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #080000;
            color: #ff6666;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .phase {
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 1.1rem;

            border: 2px solid #662222;
            border-radius: 12px;

            padding: 12px;
            margin-bottom: 20px;

            background: #220000;
        }

        .counter {
            text-align: center;
            font-size: 1rem;
            color: #ff9999;
            margin-bottom: 20px;
        }

        .card {
            border: 2px solid #662222;
            border-radius: 18px;
            background: #110000;

            padding: 30px 20px;

            text-align: center;
        }

        .test-id {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .setting-label {
            font-size: 0.9rem;
            color: #aa6666;
            margin-bottom: 4px;
        }

        .setting-value {
            font-size: 2rem;
            margin-bottom: 18px;
        }

        .progress-container {
            height: 10px;
            background: #220000;
            border-radius: 10px;
            margin: 25px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff4444;
            transition: width .3s;
        }

        .primary-button {
            width: 100%;
            background: #440000;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 22px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
        }

        .nav {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .nav button {
            flex: 1;
            background: #220000;
            color: #ff9999;
            border: 1px solid #662222;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
        }

        .complete-screen {
            text-align: center;
        }

        .complete-screen h2 {
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="workflow">

            <div id="phase" class="phase"></div>

            <div id="counter" class="counter"></div>

            <div class="card">

                <div class="test-id" id="testId"></div>

                <div class="setting-label">File</div>
                <div class="setting-value" id="filename"></div>

                <div class="setting-label">ISO</div>
                <div class="setting-value" id="iso"></div>

                <div class="setting-label">Aperture</div>
                <div class="setting-value" id="aperture"></div>

                <div class="setting-label">Shutter</div>
                <div class="setting-value" id="shutter"></div>

            </div>

            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <button class="primary-button" onclick="markComplete()">
                ✅ SHOT TAKEN
            </button>

            <div class="nav">
                <button onclick="previousTest()">◀ PREVIOUS</button>
                <button onclick="nextTest()">NEXT ▶</button>
            </div>

        </div>

        <div id="done" class="complete-screen hidden">
            <h2>✅ All Tests Complete</h2>

            <p>
                Equivalent exposure tests and bracketing tests have been completed.
            </p>

            <br>
            <button class="primary-button" onclick="exportResults()">
                Export Log
            </button>
            <button class="primary-button" onclick="restartWorkflow()">
                Restart Workflow
            </button>
        </div>

    </div>

    <script>
        const imagePrefix = "DSC_";
        const startImageNumber = 1100;


        const equivalentTests = [

            {
                id: "T000",
                iso: "3200",
                aperture: "f/2.8",
                shutter: "20s"
            },

            {
                id: "T001",
                iso: "800",
                aperture: "f/2.8",
                shutter: "80s"
            }

        ];

        const bracketingTests = [

            {
                id: "B000",
                iso: "1600",
                aperture: "f/2.8",
                shutter: "20s"
            },

            {
                id: "B001",
                iso: "1600",
                aperture: "f/2.8",
                shutter: "40s"
            },

            {
                id: "B002",
                iso: "1600",
                aperture: "f/2.8",
                shutter: "80s"
            }

        ];

        const workflow = [
            ...equivalentTests.map(x => ({ ...x, phase: "Equivalent Exposure" })),
            ...bracketingTests.map(x => ({ ...x, phase: "Bracketing" }))
        ];

        workflow.forEach((test, index) => {

            test.filename =
                `${imagePrefix}${startImageNumber + index}`;

        });

        let currentIndex =
            parseInt(localStorage.getItem("currentIndex") || "0");

        function render() {

            if (currentIndex >= workflow.length) {

                document
                    .getElementById("workflow")
                    .classList.add("hidden");

                document
                    .getElementById("done")
                    .classList.remove("hidden");

                return;
            }

            const t = workflow[currentIndex];

            document.getElementById("phase")
                .textContent =
                "🔴 " + t.phase;

            document.getElementById("counter")
                .textContent =
                `Test ${currentIndex + 1} of ${workflow.length}`;

            document.getElementById("testId")
                .textContent = t.id;

            document.getElementById("filename")
                .textContent = t.filename;

            document.getElementById("iso")
                .textContent = t.iso;

            document.getElementById("aperture")
                .textContent = t.aperture;

            document.getElementById("shutter")
                .textContent = t.shutter;

            const pct =
                ((currentIndex) / workflow.length) * 100;

            document.getElementById("progressBar")
                .style.width =
                pct + "%";
        }

        function exportResults() {

            const headers = [
                "TestID",
                "Filename",
                "Phase",
                "ISO",
                "Aperture",
                "Shutter",
                "CaptureTime"
            ];

            let rows = [headers.join(",")];

            workflow.forEach(test => {

                rows.push([
                    test.id,
                    test.filename,
                    test.phase,
                    test.iso,
                    test.aperture,
                    test.shutter,
                    test.captureTime || ""
                ].join(","));

            });

            const csv =
                rows.join("\n");

            const blob =
                new Blob(
                    [csv],
                    { type: "text/csv" }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;
            a.download = "night-photo-tests.csv";

            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
        }

        function nextTest() {

            if (currentIndex < workflow.length - 1) {

                currentIndex++;

                localStorage.setItem(
                    "currentIndex",
                    currentIndex
                );

                render();
            }
        }

        function previousTest() {

            if (currentIndex > 0) {

                currentIndex--;

                localStorage.setItem(
                    "currentIndex",
                    currentIndex
                );

                render();
            }
        }

        function markComplete() {

            const t = workflow[currentIndex];

            t.captureTime =
                new Date().toLocaleTimeString();

            currentIndex++;

            localStorage.setItem(
                "currentIndex",
                currentIndex
            );

            localStorage.setItem(
                "captureLog",
                JSON.stringify(workflow)
            );

            render();
        }

        currentIndex++;

        localStorage.setItem(
            "currentIndex",
            currentIndex
        );

        render();

        function restartWorkflow() {

            currentIndex = 0;

            localStorage.setItem(
                "currentIndex",
                "0"
            );

            document
                .getElementById("done")
                .classList.add("hidden");

            document
                .getElementById("workflow")
                .classList.remove("hidden");

            render();
        }

        render();

    </script>

</body>

</html>
